<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LogiControl V10</title><style>
:root{--bg:#07101b;--p:#101b2b;--p2:#16243a;--line:#293b56;--txt:#eef5ff;--mut:#91a2ba;--a:#8b5cf6;--ok:#22c55e;--warn:#f59e0b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#17102f 0,#07101b 42%);color:var(--txt);font:14px system-ui,-apple-system,Segoe UI,sans-serif}.app{display:flex;min-height:100vh}.side{width:245px;position:fixed;inset:0 auto 0 0;background:#09121f;border-right:1px solid var(--line);padding:18px 12px}.brand{display:flex;gap:10px;align-items:center;padding:8px 8px 22px}.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#8b5cf6,#c4b5fd);display:grid;place-items:center;font-weight:900;color:#130c24}.brand small{display:block;color:var(--mut);margin-top:2px}.side button{display:block;width:100%;padding:12px 13px;margin:4px 0;border:0;border-radius:10px;background:transparent;color:#b9c7d9;text-align:left}.side button:hover,.side .active{background:#18243a;color:#fff}.main{margin-left:245px;width:calc(100% - 245px);padding:26px;max-width:1500px}.head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px}.head h1{margin:0;font-size:28px}.head p{color:var(--mut);margin:6px 0}.btn{padding:10px 14px;border:1px solid var(--line);background:var(--p);color:#fff;border-radius:10px}.primary{background:var(--a);border-color:var(--a)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{background:#101b2beF;border:1px solid var(--line);border-radius:16px;padding:17px;box-shadow:0 16px 50px #0004}.label{color:var(--mut);font-size:12px}.num{font-size:28px;font-weight:800;margin-top:8px}.hint{color:#aebbd0;font-size:12px;margin-top:6px}.cols{display:grid;grid-template-columns:1.4fr .8fr;gap:15px;margin-top:15px}.modules{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.module{background:#0c1727;border:1px solid var(--line);border-radius:12px;padding:14px}.module b{display:block;margin-bottom:5px}.module span{color:var(--mut);font-size:12px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px;border-bottom:1px solid #23334a;text-align:left;font-size:13px}.table th{color:var(--mut)}.badge{padding:4px 8px;border-radius:99px;background:#263348;font-size:11px}.ok{background:#123b28;color:#91f1b6}.warn{background:#4a3515;color:#ffd98b}.login{min-height:100vh;display:grid;place-items:center;padding:18px}.loginbox{width:min(420px,100%);background:#0f1a2a;border:1px solid var(--line);border-radius:20px;padding:28px}.field{margin:14px 0}.field label{display:block;color:var(--mut);font-size:12px;margin-bottom:6px}.field input{width:100%;padding:12px;background:#091321;border:1px solid var(--line);border-radius:10px;color:#fff}.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:18px}.modalbox{width:min(520px,100%);background:#0f1a2a;border:1px solid var(--line);border-radius:18px;padding:22px}.toast{position:fixed;right:18px;bottom:18px;background:#17263a;border:1px solid var(--line);padding:12px 15px;border-radius:10px;display:none}@media(max-width:900px){.cards{grid-template-columns:1fr 1fr}.cols{grid-template-columns:1fr}.modules{grid-template-columns:1fr 1fr}}@media(max-width:650px){.side{width:68px}.brand div:not(.logo),.side button span{display:none}.main{margin-left:68px;width:calc(100% - 68px);padding:16px}.cards{grid-template-columns:1fr 1fr}.head h1{font-size:22px}}
</style></head><body><div id="root"></div><div id="toast" class="toast"></div><script>
let token=localStorage.getItem('lc_token'),user=null,dash=null;const $=s=>document.querySelector(s);async function api(u,o={}){const h={'Content-Type':'application/json',...(o.headers||{})};if(token)h.Authorization='Bearer '+token;const r=await fetch(u,{...o,headers:h}),d=await r.json().catch(()=>({}));if(r.status===401){logout();throw Error('Sessão expirada')}if(!r.ok)throw Error(d.erro||'Erro');return d}function toast(x){let t=$('#toast');t.textContent=x;t.style.display='block';setTimeout(()=>t.style.display='none',2500)}function logout(){localStorage.removeItem('lc_token');token=null;login()}function login(){document.body.innerHTML='<div class="login"><div class="loginbox"><div class="brand"><div class="logo">LC</div><div><b>LogiControl V10</b><small>Gestão logística definitiva</small></div></div><h2>Acesso ao sistema</h2><form id="lf"><div class="field"><label>E-mail</label><input id="em" value="admin@logicontrol.local"></div><div class="field"><label>Senha</label><input id="pw" type="password" value="1234"></div><button class="btn primary" style="width:100%">Entrar</button></form><p style="color:var(--mut);font-size:12px">Primeiro acesso: admin@logicontrol.local / 1234</p></div></div>';$('#lf').onsubmit=async e=>{e.preventDefault();try{let d=await api('/auth/login',{method:'POST',body:JSON.stringify({email:$('#em').value,senha:$('#pw').value})});token=d.token;localStorage.setItem('lc_token',token);start()}catch(e){toast(e.message)}}}async function start(){try{user=(await api('/auth/me')).usuario;dash=await api('/dashboard');render('dashboard')}catch(e){login()}}function render(page){document.body.innerHTML='<div class="app"><aside class="side"><div class="brand"><div class="logo">LC</div><div><b>LogiControl</b><small>V10 • Definitivo</small></div></div>'+[['dashboard','▦','Dashboard'],['pedidos','▤','Pedidos'],['produtos','◈','Estoque'],['clientes','◎','Clientes'],['entregas','➜','Entregas'],['frota','▰','Frota'],['relatorios','◒','Relatórios'],['auditoria','⌁','Auditoria']].map(x=>`<button class="${page==x[0]?'active':''}" onclick="render('${x[0]}')"><span>${x[1]} </span>${x[2]}</button>`).join('')+'<button onclick="logout()">↪ Sair</button></aside><main class="main" id="m"></main></div>';pageView(page)}async function pageView(p){let m=$('#m');m.innerHTML='<div class="head"><div><h1>'+({dashboard:'Visão geral',pedidos:'Pedidos',produtos:'Estoque',clientes:'Clientes',entregas:'Entregas',frota:'Frota',relatorios:'Relatórios',auditoria:'Auditoria'}[p])+'</h1><p>Operação centralizada • '+new Date().toLocaleDateString('pt-BR')+'</p></div><div><button class="btn" onclick="pageView(\''+p+'\')">↻ Atualizar</button> <button class="btn primary" onclick="novo(\''+p+'\')">+ Novo</button></div></div>';try{if(p==='dashboard')dashView(m);else if(p==='produtos')list(m,'Produtos','/produtos',['id','nome','categoria','quantidade','minimo','preco_padrao']);else if(p==='clientes')list(m,'Clientes','/clientes',['id','nome','cidade','telefone','email']);else if(p==='pedidos')list(m,'Pedidos','/pedidos',['id','cliente_nome','status','prioridade','valor_total']);else if(p==='entregas')list(m,'Entregas','/entregas',['id','pedido_id','cliente_nome','motorista_nome','placa','status']);else if(p==='frota'){list(m,'Motoristas','/motoristas',['id','nome','telefone','ativo']);list(m,'Veículos','/veiculos',['id','placa','modelo','status'])}else if(p==='relatorios')reports(m);else list(m,'Auditoria','/auditoria',['criado_em','usuario_nome','acao','entidade','entidade_id'])}catch(e){m.innerHTML+='<div class="card">'+e.message+'</div>'}}function dashView(m){let d=dash;m.innerHTML+=`<div class="cards"><div class="card"><div class="label">Produtos ativos</div><div class="num">${d.produtos}</div><div class="hint">${d.estoqueBaixo} em estoque baixo</div></div><div class="card"><div class="label">Clientes</div><div class="num">${d.clientes}</div><div class="hint">Base operacional</div></div><div class="card"><div class="label">Pedidos</div><div class="num">${d.pedidos}</div><div class="hint">${d.pendentes} em andamento</div></div><div class="card"><div class="label">Faturamento</div><div class="num">R$ ${Number(d.faturamento).toLocaleString('pt-BR',{minimumFractionDigits:2})}</div><div class="hint">${d.entregas} entregas abertas</div></div></div><div class="cols"><div class="card"><h3>Central operacional</h3><div class="modules"><div class="module"><b>Pedidos</b><span>Fluxo completo de venda</span></div><div class="module"><b>Estoque</b><span>Saldo e mínimos</span></div><div class="module"><b>Logística</b><span>Frota e entregas</span></div><div class="module"><b>Financeiro</b><span>Custos e resultado</span></div><div class="module"><b>Clientes</b><span>Base operacional</span></div><div class="module"><b>Auditoria</b><span>Rastreabilidade</span></div></div></div><div class="card"><h3>Saúde do estoque</h3><p>${d.estoqueBaixo} produtos precisam de atenção.</p><div style="height:8px;background:#243248;border-radius:8px"><div style="height:100%;width:${Math.min(100,d.estoqueBaixo/Math.max(1,d.produtos)*100)}%;background:var(--a);border-radius:8px"></div></div></div></div>`}async function list(m,title,url,keys){let rows=await api(url);m.innerHTML+=`<div class="card" style="margin-top:15px"><h3>${title}</h3><table class="table"><thead><tr>${keys.map(k=>'<th>'+k+'</th>').join('')}</tr></thead><tbody>${rows.length?rows.map(r=>'<tr>'+keys.map(k=>'<td>'+((k==='valor_total'||k==='preco_padrao')?'R$ '+Number(r[k]||0).toLocaleString('pt-BR',{minimumFractionDigits:2}):(r[k]??'—'))+'</td>').join('')+'</tr>').join(''):'<tr><td colspan="'+keys.length+'">Nenhum registro</td></tr>'}</tbody></table></div>`}async function reports(m){let r=await api('/dashboard');m.innerHTML+=`<div class="cards"><div class="card"><div class="label">Faturamento</div><div class="num">R$ ${Number(r.faturamento).toLocaleString('pt-BR',{minimumFractionDigits:2})}</div></div><div class="card"><div class="label">Pedidos</div><div class="num">${r.pedidos}</div></div><div class="card"><div class="label">Pendentes</div><div class="num">${r.pendentes}</div></div><div class="card"><div class="label">Entregas abertas</div><div class="num">${r.entregas}</div></div></div>`}function novo(p){if(p==='produtos')modal('Novo produto','produtos');else if(p==='clientes')modal('Novo cliente','clientes');else toast('Este módulo está preparado para expansão na V10.')}function modal(title,type){let fields=type==='produtos'?'<input name="nome" placeholder="Nome" required><input name="categoria" placeholder="Categoria"><input name="quantidade" type="number" placeholder="Quantidade" value="0"><input name="minimo" type="number" placeholder="Mínimo" value="0"><input name="preco_padrao" type="number" step=".01" placeholder="Preço" value="0">':'<input name="nome" placeholder="Nome" required><input name="cidade" placeholder="Cidade"><input name="telefone" placeholder="Telefone"><input name="email" placeholder="E-mail"><input name="documento" placeholder="Documento">';document.body.insertAdjacentHTML('beforeend',`<div class="modal"><div class="modalbox"><h2>${title}</h2><form id="mf">${fields}<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:15px"><button type="button" class="btn" onclick="this.closest('.modal').remove()">Cancelar</button><button class="btn primary">Salvar</button></div></form></div></div>`);document.querySelectorAll('#mf input').forEach(i=>i.style='display:block;width:100%;margin:10px 0;padding:11px;background:#091321;border:1px solid #293b56;border-radius:9px;color:white');$('#mf').onsubmit=async e=>{e.preventDefault();try{await api('/'+type,{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});e.target.closest('.modal').remove();await start();toast('Registro criado')}catch(x){toast(x.message)}}}if(token)start();else login();
</script></body></html>
